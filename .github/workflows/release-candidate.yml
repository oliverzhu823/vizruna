# Build the exact signed/notarized macOS artifacts that will be tested and,
# after formal approval, promoted without rebuilding.
name: Build macOS Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac-candidate:
    runs-on: macos-15
    timeout-minutes: 90
    environment: v0.1-candidate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Complete repository quality gate
        run: npm run verify

      - name: Run desktop end-to-end tests
        run: npm run test:e2e

      - name: Audit complete and production dependency trees
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: Clean dist
        run: rm -rf dist

      - name: Package, sign, notarize, staple, and verify (DMG + ZIP)
        run: npm run package:mac:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Record candidate identity and hashes
        run: |
          set -euo pipefail
          echo "Candidate commit: ${GITHUB_SHA}"
          echo "Candidate run ID: ${GITHUB_RUN_ID}"
          shasum -a 256 dist/*.dmg dist/*.zip

      - name: Upload immutable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-mac-candidate-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
