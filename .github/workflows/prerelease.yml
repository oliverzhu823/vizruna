# Vizruna-web is the only actively distributed product. The retained desktop
# sources are not packaged or uploaded by this workflow.
name: Release Vizruna-web

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release-vizruna-web:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require tag and package versions to match
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Complete repository quality gate
        run: npm run verify

      - name: Run Vizruna-web browser end-to-end tests
        run: |
          npm run test:e2e:install
          npm run test:e2e:web

      - name: Audit dependencies
        run: node scripts/ci-audit.mjs

      - name: Prepare Vizruna-web release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          WEB_ARCHIVE="release-assets/Vizruna-web-${VERSION}-source.zip"
          git archive --format=zip --prefix="Vizruna-web-${VERSION}/" --output="${WEB_ARCHIVE}" HEAD
          unzip -Z1 "${WEB_ARCHIVE}" | grep -qx "Vizruna-web-${VERSION}/Start-Vizruna-web.command"
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = "1"
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "0"
          node scripts/generate-release-sbom.mjs release-assets/sbom.cdx.json
          node scripts/generate-release-checksums.mjs release-assets
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/**

      - name: Build user-facing release notes
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.mjs "${GITHUB_REF_NAME#v}" > release-body.md
          test -s release-body.md

      - name: Publish Vizruna-web release
        uses: softprops/action-gh-release@v2
        with:
          name: Vizruna-web ${{ github.ref_name }}
          body_path: release-body.md
          files: release-assets/**
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
