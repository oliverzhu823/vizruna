# Early macOS prereleases are intentionally distributed without Developer ID
# signing or notarization. Stable releases keep the signed candidate gate.
name: Release Unsigned macOS Prerelease

on:
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'
      - 'v*-rc.*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release-mac-prerelease:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require tag and package versions to match
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retry in 20s..."
            sleep 20
          done
          exit 1

      - name: Complete repository quality gate
        run: npm run verify

      - name: Run desktop end-to-end tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: node scripts/ci-audit.mjs

      - name: Clean generated release directory
        run: node -e "require('node:fs').rmSync(require('node:path').resolve('dist'), { recursive: true, force: true })"

      - name: Package and verify unsigned Apple Silicon build
        run: npm run package:mac:unsigned

      - name: Smoke test packaged application with isolated data
        run: npm run test:package

      - name: Prepare public release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp '{}' release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = "1"
          node scripts/generate-release-sbom.mjs release-assets/sbom.cdx.json
          node scripts/generate-release-checksums.mjs release-assets
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Attest prerelease artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/**

      - name: Build user-facing release notes
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.mjs "${GITHUB_REF_NAME#v}" > release-body.md
          test -s release-body.md

      - name: Publish unsigned macOS prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Vizruna ${{ github.ref_name }} — Unsigned macOS Test Build
          body_path: release-body.md
          files: release-assets/**
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
