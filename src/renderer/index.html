<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vizruna</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Anti-FOUC: restore theme before React mounts (see docs/ui-design-notes.md §7).
      // Reads from the versioned UI preference cache in localStorage.
      (function () {
        try {
          var raw = localStorage.getItem('vizruna-ui:v1');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (theme === 'sage') document.documentElement.classList.add('sage');
          if (theme === 'apricot') document.documentElement.classList.add('apricot');
          var isDark = theme === 'dark'
            || (theme !== 'light' && theme !== 'sage' && theme !== 'apricot' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          console.warn('[vizruna] theme bootstrap failed', e);
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
